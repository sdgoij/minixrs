# The third-party pins, read by the xtask and by the builders that stay in Python.
#
# `cargo xtask pin bash|mesa` derives the release tag from the commit here and the
# `rust` gitlink, which is why a toolchain bump rebuilds rather than ships a stale
# artifact. Bumping a third-party version is editing the commit (and, for Mesa, the
# build config) here.
bash.upstream=https://git.savannah.gnu.org/git/bash.git
bash.git=https://github.com/sdgoij/bash.git
bash.push=git@github.com:sdgoij/bash.git
bash.commit=b460816602167718f78a6233164e8875f49b75b2
bash.describe=Bash-5.3 patch 15
mesa.git=https://gitlab.freedesktop.org/mesa/mesa.git
mesa.tag=mesa-25.3.6
mesa.commit=06f9e28304d5d3f109c33535c1c25b9df5769af2
drm.git=https://gitlab.freedesktop.org/mesa/drm.git
drm.tag=libdrm-2.4.129
drm.commit=a8e5e10a873f67f557dc70e5407af4553f35edd9
# Part of the `mesa-<pin>` release tag. The tag also carries the `tools/c-include`
# tree the DSOs compile against, so a header ABI change rebuilds them without a
# bump here; edit this only for a change in how the DSOs are configured.
mesa.build_config=gbm

# The Doom engine is built from source, unlike bash and Mesa: doomgeneric is a
# platform port, and the platform layer (`tools/doom/doomgeneric_minix.c`) is
# part of this tree. `cargo xtask build doom` checks this tree out under
# `target/doom-src` and holds the shareware IWAD to `doom.wad.sha256`; the URL
# is a convenience, the digest is the pin. The WAD is the freely
# redistributable shareware episode, not the registered game.
doom.git=https://github.com/ozkl/doomgeneric.git
doom.commit=e257a09527062bfb986b6e5e0780839b6cbd5b71
doom.describe=doomgeneric, 2026-10-11
doom.wad.url=https://raw.githubusercontent.com/samrude005/doom1.wad/main/doom1.wad
doom.wad.sha256=1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771
