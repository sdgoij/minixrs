# 4d's gates. Its own workspace, like `tools/phase4-gate`: the root workspace must not read
# this `[patch.crates-io]` table, or the forks would become a checkout requirement for every
# build in the tree, and `[patch.crates-io]` is only legal at a workspace root anyway.
#
# `target/smithay` is the pinned checkout `tools/build-smithay.py` fetches, so this project
# needs that script (or `tools/build-phase4-comp.py`, which runs it) before cargo can read
# this manifest. The forks are submodules at the repo root.
[workspace]

[package]
name = "phase4-comp"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase 4d's gates: smithay's renderer and compositor on the minix targets"

[dependencies]
smithay = { path = "../../target/smithay", default-features = false, features = [
    "wayland_frontend",
    # Surfaceless EGL plus the GLES renderer is 4d's render path (`.notes/wayland.md`
    # 6.13, D17/D18). `use_system_lib` stays off: the compositor is its own server.
    "backend_egl",
    "renderer_gl",
] }
# Deliberately *not* `minix-libc`: its rlib is the static image's C library, where `dlopen`
# answers "this program is statically linked". A dynamic image takes those symbols from
# `libc.so` instead (the build script links it), which is the build whose `dlopen` forwards
# to the loader.
minix-rt = { path = "../../crates/minix-rt", default-features = false }
# The client's shm pool: `memfd_create`/`ftruncate` live in the port's syscall layer.
minix-std = { path = "../../crates/minix-std" }
# The HID usage -> evdev table the in-house seat already uses (host-tested), so the compositor
# translates input the same way `wlserver` does.
wayland = { path = "../../crates/wayland" }
# The gate's client half: a stock wayland-rs client, patched to the fork like the server.
wayland-client = "0.31"
# The dma-buf client's `wp::linux_dmabuf::zv1`, the same protocol crate the server side uses and
# patched to the fork with the rest of the wayland-rs family. The version is the fork's (the
# protocol crates must pair with the backend), and `client` is what generates the client side.
wayland-protocols = { version = "0.32", features = ["client"] }
# `setenv`, for the compositor's `XKB_CONFIG_ROOT`: `std::env::set_var` on this port only updates
# Rust's own snapshot, and xkbcommon is C. The libc is the fork, patched below.
libc = "0.2"
# `rand` in smithay's graph reaches `getrandom`, whose 0.3 line takes its backend from a
# `register_custom_getrandom!` in the binary (`--cfg getrandom_backend="custom"`).
getrandom = "0.3"
# The compositor's loop: the same calloop 4a proved, driving the display and the listening socket.
calloop = "0.14.5"
# The software renderer's texture matrix: the same 3x3 type and helpers smithay's `Transform`
# hands out (`Transform::matrix`), so the two renderers compose identical transforms.
cgmath = "0.18"

[patch.crates-io]
errno = { path = "../../crates/errno" }
# The published crate implements `cfg(unix)`/`cfg(windows)`, so minix gets its "unsupported
# platform" stub; smithay needs `tempfile_in` to hand an xkb keymap to a client.
tempfile = { path = "../../crates/tempfile" }
libc = { path = "../../libc" }
# `libloading` is what `backend_egl` loads EGL with; it gates its Unix half on `cfg(unix)`.
libloading = { path = "../../rust_libloading" }
rustix = { path = "../../rustix" }
polling = { path = "../../polling" }
calloop = { path = "../../calloop" }
# The wayland-rs family is patched together: the protocol crates generate code against
# the server API, so a half-patched family pairs two versions of it.
wayland-sys = { path = "../../wayland-rs/wayland-sys" }
wayland-scanner = { path = "../../wayland-rs/wayland-scanner" }
wayland-backend = { path = "../../wayland-rs/wayland-backend" }
wayland-client = { path = "../../wayland-rs/wayland-client" }
wayland-server = { path = "../../wayland-rs/wayland-server" }
wayland-protocols = { path = "../../wayland-rs/wayland-protocols" }
wayland-protocols-wlr = { path = "../../wayland-rs/wayland-protocols-wlr" }
wayland-protocols-misc = { path = "../../wayland-rs/wayland-protocols-misc" }

[[bin]]
name = "glgate"
path = "src/bin/glgate.rs"

[[bin]]
name = "wlcomp"
path = "src/bin/wlcomp.rs"

[[bin]]
name = "wlshm"
path = "src/bin/wlshm.rs"

[[bin]]
name = "wlseat"
path = "src/bin/wlseat.rs"

[[bin]]
name = "wldmabuf"
path = "src/bin/wldmabuf.rs"
