[workspace]
resolver = "3"

exclude = [
    "crates/kernel-tests",
    # The rust fork is a nested repository with its own workspace; exclude it
    # so cargo operations inside `rust/` (e.g. the bootstrap build) don't
    # resolve to this workspace.
    "rust",
]

members = [
    "crates/arch-aarch64",
    "crates/arch-common",
    "crates/arch-x86_64",
    "crates/arch-riscv64",
    "crates/boot-image",
    "crates/drivers",
    "crates/fs",
    "crates/kernel",
    "crates/kernel-boot",
    "crates/libs",
    "crates/minix-libc",
    "crates/minix-rt",
    "crates/minix-std",
    "crates/minix-util",
    "crates/net",
    "crates/servers",
    "crates/userland",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "GPL2.0"

[workspace.dependencies]
bitflags = { version = "2", default-features = false }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
