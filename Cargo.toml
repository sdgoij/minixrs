[workspace]
resolver = "3"

exclude = [
    "crates/kernel-tests",
    # Enables `kernel/sim`; sharing the workspace build graph would let cargo's
    # feature unification turn `sim` on for the real boot binaries too.
    "crates/kernel-sim-tests",
    # wasm-only binary with no host entry point; a workspace-wide build could not
    # link it.
    "crates/kernel-wasm",
    # The rust fork is a nested repository with its own workspace; exclude it
    # so cargo operations inside `rust/` (e.g. the bootstrap build) don't
    # resolve to this workspace.
    "rust",
    # Likewise for the ecosystem forks: building or testing one on its own
    # must not resolve to this workspace's graph.
    "libc",
    "rustix",
    "polling",
    "calloop",
    # The compositor is fetched as a fork and built from a generated workspace
    # of its own (`tools/build-cosmic-comp.py`), never as a member here.
    "cosmic-comp",
    # A `[patch.crates-io]` stand-in for the `errno` crate. It is ours rather
    # than a fork, but it exists to be patched into a foreign graph: as a member
    # it would shadow nothing (`[patch]` is the only way it is consumed) and
    # would build the wrong thing into this workspace's lockfile.
    "crates/errno",
    # The same shape, for `tempfile`: the published crate has no minix arm, and
    # smithay needs one function (`tempfile_in`) to hand a keymap to a client.
    "crates/tempfile",
    # And for `atomicwrites`: the settings store writes through it, and the
    # published crate reaches rustix 0.38, which this tree does not fork. The
    # stand-in spells the same two moves with std.
    "crates/atomicwrites",
    # And for `terminal_size`: it asks rustix's termios for the window size, which
    # the port's rustix fork does not serve. `clap`'s `wrap_help` pulls it in.
    "crates/terminal_size",
    # The settings stack: `cosmic-config` is replaced together with its `dirs`
    # source and its entry derive, so the whole set is a path patch into
    # cosmic-comp's graph rather than a member of this one.
    "crates/cosmic-config",
    "crates/cosmic-config-derive",
    "crates/dirs",
]

members = [
    "crates/arch-aarch64",
    "crates/arch-common",
    "crates/arch-x86_64",
    "crates/arch-riscv64",
    "crates/arch-sim",
    "crates/arch-wasm32",
    "crates/boot-image",
    "crates/drivers",
    "crates/fs",
    "crates/kernel",
    "crates/kernel-boot",
    "crates/ldso",
    "crates/libs",
    "crates/minix-libc",
    "crates/minix-rt",
    "crates/minix-std",
    "crates/minix-util",
    "crates/net",
    "crates/servers",
    "crates/userland",
    "crates/wayland",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "GPL2.0"

[workspace.dependencies]
bitflags = { version = "2", default-features = false }

# The host toolchain (rustup) has no minix target, so `target_os = "minix"`
# would trip `unexpected_cfgs`; the fork's rustc knows the value natively.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(target_os, values(\"minix\"))"] }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
