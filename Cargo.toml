[workspace]
resolver = "3"

exclude = [
    "crates/kernel-tests",
    # Enables `kernel/sim`; sharing the workspace build graph would let cargo's
    # feature unification turn `sim` on for the real boot binaries too.
    "crates/kernel-sim-tests",
    # wasm-only binary with no host entry point; a workspace-wide build could not
    # link it.
    "crates/kernel-wasm",
    # The rust fork is a nested repository with its own workspace; exclude it
    # so cargo operations inside `rust/` (e.g. the bootstrap build) don't
    # resolve to this workspace.
    "rust",
    # Likewise for the ecosystem forks: building or testing one on its own
    # must not resolve to this workspace's graph.
    "libc",
    "rustix",
    # A `[patch.crates-io]` stand-in for the `errno` crate. It is ours rather
    # than a fork, but it exists to be patched into a foreign graph: as a member
    # it would shadow nothing (`[patch]` is the only way it is consumed) and
    # would build the wrong thing into this workspace's lockfile.
    "crates/errno",
]

members = [
    "crates/arch-aarch64",
    "crates/arch-common",
    "crates/arch-x86_64",
    "crates/arch-riscv64",
    "crates/arch-sim",
    "crates/arch-wasm32",
    "crates/boot-image",
    "crates/drivers",
    "crates/fs",
    "crates/kernel",
    "crates/kernel-boot",
    "crates/ldso",
    "crates/libs",
    "crates/minix-libc",
    "crates/minix-rt",
    "crates/minix-std",
    "crates/minix-util",
    "crates/net",
    "crates/render",
    "crates/servers",
    "crates/ui",
    "crates/userland",
    "crates/wayland",
    # Host-side tooling, run as `cargo xtask`. A `std` binary for the host: it
    # must not depend on a target crate, or feature unification could reach a
    # minix build through it.
    "crates/xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "GPL2.0"

[workspace.dependencies]
bitflags = { version = "2", default-features = false }

# `crates/xtask` only. No colour: the gates print to a CI log, and `color`
# pulls the anstream stack in for nothing.
clap = { version = "4.6", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
# The static gates are text scanners; `regex-lite` is the one-crate subset, and
# a lookahead-free rewrite of the only pattern that wanted one.
regex-lite = "0.1"
# `fetch-stage1` verifies and unpacks the published toolchain. All three are pure
# Rust: the transport is `curl`, a named tool like clang or QEMU, because a TLS
# stack would outweigh everything else this crate links.
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
xz2 = "0.1"

# The host toolchain (rustup) has no minix target, so `target_os = "minix"`
# would trip `unexpected_cfgs`; the fork's rustc knows the value natively.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(target_os, values(\"minix\"))"] }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
