[alias]
# `cargo xtask <command>`: the host tooling in `crates/xtask`. The separate
# target dir keeps the binary out of `target/`, which `bootstrap` cleans; on
# Windows `cargo clean` cannot delete an executable that is still running, and
# the tool that runs `bootstrap` is exactly that executable. Run it from the
# repository root, since a relative `--target-dir` is resolved from the cwd.
xtask = "run --quiet --package xtask --target-dir .xtask --"

[target.riscv64gc-unknown-minix]
rustflags = ["-C", "link-arg=-Ttools/minix-raw-riscv64.ld"]

[target.aarch64-unknown-minix]
rustflags = ["-C", "link-arg=-Ttools/minix-raw-aarch64.ld"]

[target.x86_64-pc-minix]
rustflags = ["-C", "link-arg=-Ttools/minix-raw.ld"]

[env]
# Tests share global mutable state (UnsafeCell) — must run single-threaded.
RUST_TEST_THREADS = "1"
