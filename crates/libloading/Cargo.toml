# A stand-in for the `libloading` crate, which has no minix arm: it hard-codes
# the `RTLD_*` values per `target_os`, with a `compile_error!` for anything it
# does not know. Projects that pull it in point `[patch.crates-io]` here.
#
# The version is upstream's so it satisfies the requirement its consumers
# declare (`^0.9.0` from the compiler). `publish` is off: a name-shadowing
# package must never reach a registry.
[package]
name = "libloading"
version = "0.9.0"
edition = "2024"
rust-version = "1.96"
license = "GPL2.0"
description = "The minix dynamic loader, as a stand-in for the libloading crate"
publish = false
