[package]
name = "ldso"
version = "0.1.0"
description = "Dynamic loader (`/libexec/ld.so`) for the minix port"
edition = "2024"
rust-version = "1.96"
license = "GPL2.0"

[lib]
name = "ldso"
path = "src/lib.rs"

# The loader binary. Installed as `/libexec/ld.so` (the name is the image's, not
# cargo's). Built for a minix target only — behind a feature so a host
# `cargo clippy`/`test` does not try to type-check or link it.
[[bin]]
name = "ldso"
path = "src/bin/ldso.rs"
test = false
required-features = ["bin"]

[features]
# Enables the `ldso` binary. Off for host builds.
bin = []

[dependencies]
minix-rt = { path = "../minix-rt", default-features = false }
# The loader stats every `DT_NEEDED` it opens, so that two names for one file are one
# mapping rather than two — `fstat`'s `st_dev`/`st_ino` is the only thing that settles
# a second spelling of a file. The VFS call numbers and message layouts are
# `minix-std`'s (`fs::fstat`), so the alternative is a second copy of `VFS_FSTAT`'s
# layout here, which is the kind of duplicate that goes stale. `minix-std` is `no_std`
# and needs no allocator, and the loader links only that one path.
minix-std = { path = "../minix-std", default-features = false }

[lints]
workspace = true
