[package]
name = "userland"
version = "0.1.0"
description = "Individual userland binaries"

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.license]
workspace = true

[dependencies]
minix-rt = { path = "../minix-rt" }
minix-std = { path = "../minix-std" }

# Binary targets — these are #![no_std] / #![no_main] embedded MINIX
# binaries that cannot run as host-native tests. Tests live in the lib target.
[[bin]]
name = "cat"
path = "src/bin/cat.rs"
test = false

[[bin]]
name = "echo"
path = "src/bin/echo.rs"
test = false

[[bin]]
name = "cp"
path = "src/bin/cp.rs"
test = false

[[bin]]
name = "init"
path = "src/bin/init.rs"
test = false

[[bin]]
name = "ls"
path = "src/bin/ls.rs"
test = false

[[bin]]
name = "mkdir"
path = "src/bin/mkdir.rs"
test = false

[[bin]]
name = "rm"
path = "src/bin/rm.rs"
test = false

[[bin]]
name = "ln"
path = "src/bin/ln.rs"
test = false

[[bin]]
name = "chmod"
path = "src/bin/chmod.rs"
test = false

[[bin]]
name = "chown"
path = "src/bin/chown.rs"
test = false

[[bin]]
name = "id"
path = "src/bin/id.rs"
test = false

[[bin]]
name = "su"
path = "src/bin/su.rs"
test = false

[[bin]]
name = "sync"
path = "src/bin/sync.rs"
test = false

[[bin]]
name = "ping"
path = "src/bin/ping.rs"
test = false

[[bin]]
name = "udp"
path = "src/bin/udp.rs"
test = false

[[bin]]
name = "tcp"
path = "src/bin/tcp.rs"
test = false

[[bin]]
name = "tcpserver"
path = "src/bin/tcpserver.rs"
test = false

[[bin]]
name = "udp_echo"
path = "src/bin/udp_echo.rs"
test = false

[[bin]]
name = "mknod"
path = "src/bin/mknod.rs"
test = false

[[bin]]
name = "reboot"
path = "src/bin/reboot.rs"
test = false

[[bin]]
name = "fsck"
path = "src/bin/fsck.rs"
test = false

[[bin]]
name = "kill"
path = "src/bin/kill.rs"
test = false

[[bin]]
name = "sigtest"
path = "src/bin/sigtest.rs"
test = false

[[bin]]
name = "sh"
path = "src/bin/sh.rs"
test = false

[[bin]]
name = "threadtest"
path = "src/bin/threadtest.rs"
test = false

# mmapfd / forktest are test binaries autodiscovered from src/bin/; they are
# #![no_std] / #![no_main] embedded MINIX binaries that cannot run as
# host-native test harnesses.
[[bin]]
name = "mmapfd"
path = "src/bin/mmapfd.rs"
test = false

[[bin]]
name = "forktest"
path = "src/bin/forktest.rs"
test = false

# forkthread is a fork-from-worker test: spawns a thread, forks from it,
# and verifies the child is a copy of the worker (Phase F2). Embedded as
# /bin/forkthread.
[[bin]]
name = "forkthread"
path = "src/bin/forkthread.rs"
test = false

# ptracetest is the ptrace smoke test: TRACEME + SIGSTOP stop, CONTINUE
# resume, and exit reap through PM_PTRACE (Phase J6). Embedded as
# /bin/ptracetest.
[[bin]]
name = "ptracetest"
path = "src/bin/ptracetest.rs"
test = false

# unametest is the uname smoke test: fetches PM_SYSUNAME fields and
# verifies sysname/nodename/machine (J6 follow-up). Embedded as
# /bin/unametest.
[[bin]]
name = "unametest"
path = "src/bin/unametest.rs"
test = false

# eptest is the PM_GETEPINFO smoke test: queries its own pid/uid/gid by
# endpoint and cross-checks getpid/getuid/getgid. Embedded as /bin/eptest.
[[bin]]
name = "eptest"
path = "src/bin/eptest.rs"
test = false

# utimetest is the utime smoke test: exercises the VFS_UTIMENS → MFS
# fs_utime chain (explicit times, UTIME_OMIT, UTIME_NOW). Embedded as
# /bin/utimetest.
[[bin]]
name = "utimetest"
path = "src/bin/utimetest.rs"
test = false

[[bin]]
name = "fbmmap"
path = "src/bin/fbmmap.rs"
test = false

[[bin]]
name = "fbterm"
path = "src/bin/fbterm.rs"
test = false

[[bin]]
name = "wdemo"
path = "src/bin/wdemo.rs"
test = false

# allocprobe is a QEMU probe: it drives the rt mmap allocator through
# alloc/free churn and checks the VM region count stays flat (run from the
# shell by tools/alloc_churn_probe.py). Embedded as /bin/allocprobe.
[[bin]]
name = "allocprobe"
path = "src/bin/allocprobe.rs"
test = false

# ttyprobe is a QEMU probe: it opens a pty pair (/dev/ptyp0 + /dev/ttyp0)
# and round-trips bytes both ways through the tty line discipline (Phase
# M2). Embedded as /bin/ttyprobe.
[[bin]]
name = "ttyprobe"
path = "src/bin/ttyprobe.rs"
test = false

# wterm is the M3 terminal window client: opens a pty, spawns /bin/sh on
# the slave, and renders its output (VT subset) into a wserver window.
[[bin]]
name = "wterm"
path = "src/bin/wterm.rs"
test = false

[[bin]]
name = "seltest"
path = "src/bin/seltest.rs"
test = false

[lints]
workspace = true
