[package]
name = "userland"
version = "0.1.0"
description = "Individual userland binaries"

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.license]
workspace = true

[dependencies]
minix-rt = { path = "../minix-rt" }
minix-std = { path = "../minix-std" }
minix-util = { path = "../minix-util" }
wayland = { path = "../wayland" }

# Binary targets — these are #![no_std] / #![no_main] embedded MINIX
# binaries that cannot run as host-native tests. Tests live in the lib target.
[[bin]]
name = "cat"
path = "src/bin/cat.rs"
test = false

[[bin]]
name = "echo"
path = "src/bin/echo.rs"
test = false

[[bin]]
name = "cp"
path = "src/bin/cp.rs"
test = false

[[bin]]
name = "init"
path = "src/bin/init.rs"
test = false

[[bin]]
name = "ls"
path = "src/bin/ls.rs"
test = false

[[bin]]
name = "mkdir"
path = "src/bin/mkdir.rs"
test = false

[[bin]]
name = "rm"
path = "src/bin/rm.rs"
test = false

[[bin]]
name = "ln"
path = "src/bin/ln.rs"
test = false

[[bin]]
name = "chmod"
path = "src/bin/chmod.rs"
test = false

[[bin]]
name = "chown"
path = "src/bin/chown.rs"
test = false

[[bin]]
name = "id"
path = "src/bin/id.rs"
test = false

[[bin]]
name = "su"
path = "src/bin/su.rs"
test = false

[[bin]]
name = "sync"
path = "src/bin/sync.rs"
test = false

[[bin]]
name = "ping"
path = "src/bin/ping.rs"
test = false

[[bin]]
name = "udp"
path = "src/bin/udp.rs"
test = false

[[bin]]
name = "tcp"
path = "src/bin/tcp.rs"
test = false

[[bin]]
name = "tcpserver"
path = "src/bin/tcpserver.rs"
test = false

[[bin]]
name = "udp_echo"
path = "src/bin/udp_echo.rs"
test = false

[[bin]]
name = "mknod"
path = "src/bin/mknod.rs"
test = false

[[bin]]
name = "reboot"
path = "src/bin/reboot.rs"
test = false

[[bin]]
name = "fsck"
path = "src/bin/fsck.rs"
test = false

[[bin]]
name = "kill"
path = "src/bin/kill.rs"
test = false

[[bin]]
name = "sigtest"
path = "src/bin/sigtest.rs"
test = false

[[bin]]
name = "sh"
path = "src/bin/sh.rs"
test = false

[[bin]]
name = "threadtest"
path = "src/bin/threadtest.rs"
test = false

# mmapfd / forktest are test binaries autodiscovered from src/bin/; they are
# #![no_std] / #![no_main] embedded MINIX binaries that cannot run as
# host-native test harnesses.
[[bin]]
name = "mmapfd"
path = "src/bin/mmapfd.rs"
test = false

[[bin]]
name = "forktest"
path = "src/bin/forktest.rs"
test = false

# forkthread is a fork-from-worker test: spawns a thread, forks from it,
# and verifies the child is a copy of the worker (Phase F2). Embedded as
# /bin/forkthread.
[[bin]]
name = "forkthread"
path = "src/bin/forkthread.rs"
test = false

# ptracetest is the ptrace smoke test: TRACEME + SIGSTOP stop, CONTINUE
# resume, and exit reap through PM_PTRACE (Phase J6). Embedded as
# /bin/ptracetest.
[[bin]]
name = "ptracetest"
path = "src/bin/ptracetest.rs"
test = false

# unametest is the uname smoke test: fetches PM_SYSUNAME fields and
# verifies sysname/nodename/machine (J6 follow-up). Embedded as
# /bin/unametest.
[[bin]]
name = "unametest"
path = "src/bin/unametest.rs"
test = false

# eptest is the PM_GETEPINFO smoke test: queries its own pid/uid/gid by
# endpoint and cross-checks getpid/getuid/getgid. Embedded as /bin/eptest.
[[bin]]
name = "eptest"
path = "src/bin/eptest.rs"
test = false

# utimetest is the utime smoke test: exercises the VFS_UTIMENS → MFS
# fs_utime chain (explicit times, UTIME_OMIT, UTIME_NOW). Embedded as
# /bin/utimetest.
[[bin]]
name = "utimetest"
path = "src/bin/utimetest.rs"
test = false

# pipetest is the PFS pipe smoke test: pipe() creates a named-pipe inode on
# PFS, then fstat/ftruncate/fchmod on the fds route to the PFS handlers and
# bytes round-trip through the block-cache buffer. Embedded as /bin/pipetest.
[[bin]]
name = "pipetest"
path = "src/bin/pipetest.rs"
test = false

# dstest is the DS_GETSYSINFO smoke test: verifies the DS wire protocol
# (publish EPERM without a label, SI_DATA_STORE size checks + copy).
# Embedded as /bin/dstest.
[[bin]]
name = "dstest"
path = "src/bin/dstest.rs"
test = false

[[bin]]
name = "fbmmap"
path = "src/bin/fbmmap.rs"
test = false

[[bin]]
name = "fbterm"
path = "src/bin/fbterm.rs"
test = false

[[bin]]
name = "wdemo"
path = "src/bin/wdemo.rs"
test = false

# allocprobe is a QEMU probe: it drives the rt mmap allocator through
# alloc/free churn and checks the VM region count stays flat (run from the
# shell by tools/alloc_churn_probe.py). Embedded as /bin/allocprobe.
[[bin]]
name = "allocprobe"
path = "src/bin/allocprobe.rs"
test = false

# ttyprobe is a QEMU probe: it opens a pty pair (/dev/ptyp0 + /dev/ttyp0)
# and round-trips bytes both ways through the tty line discipline (Phase
# M2). Embedded as /bin/ttyprobe.
[[bin]]
name = "ttyprobe"
path = "src/bin/ttyprobe.rs"
test = false

# udstest is the UNIX-domain socket smoke test (Phase 0): a socketpair
# round-trip plus bind/listen/connect/accept through the /dev/uds server.
# Embedded as /bin/udstest and driven by `just test-uds-x86`.
[[bin]]
name = "udstest"
path = "src/bin/udstest.rs"
test = false

# memfdtest is the anonymous-shared-memory smoke test (Phase 0): create, size,
# map MAP_SHARED twice and across a fork, and check read/write agree.
# Embedded as /bin/memfdtest and driven by `just test-memfd-x86`.
[[bin]]
name = "memfdtest"
path = "src/bin/memfdtest.rs"
test = false

# wterm is the M3 terminal window client: opens a pty, spawns /bin/sh on
# the slave, and renders its output (VT subset) into a wserver window.
[[bin]]
name = "wterm"
path = "src/bin/wterm.rs"
test = false

[[bin]]
name = "seltest"
path = "src/bin/seltest.rs"
test = false

[[bin]]
name = "eventfdtest"
path = "src/bin/eventfdtest.rs"
test = false

[[bin]]
name = "timerfdtest"
path = "src/bin/timerfdtest.rs"
test = false

[[bin]]
name = "epolltest"
path = "src/bin/epolltest.rs"
test = false

# ptytest is the pty-master readiness gate: a blocking poll on /dev/ptyp0 must be
# woken by a write on /dev/ttyp0, the wake the tty server reports for a master.
# Embedded as /bin/ptytest and driven by `just test-pty-x86`.
[[bin]]
name = "ptytest"
path = "src/bin/ptytest.rs"
test = false

[[bin]]
name = "waylandtest"
path = "src/bin/waylandtest.rs"
test = false

# wlclient is the Wayland Phase 1b `wl_shm` client: it draws into a memfd pool,
# passes the fd to /sbin/wlserver, commits a surface, and reads the frame back
# from /dev/fb. Driven by `just test-wlshm-x86`.
[[bin]]
name = "wlclient"
path = "src/bin/wlclient.rs"
test = false

# wlkey is the Wayland Phase 1c input client: it binds wl_seat's keyboard,
# commits a surface so the server sends `enter`, and prints each key it receives.
# Driven by `tools/wlkey_probe.py`.
[[bin]]
name = "wlkey"
path = "src/bin/wlkey.rs"
test = false

# The Phase 2 gate clients are, like wlclient and wlkey, `#![no_main]` binaries
# whose `main` is the entry point even when compiled for `cargo test`. They need
# /dev/fb and /sbin/wlserver, so `test = false` keeps the host suite from trying
# to run them as if they were test harnesses.
[[bin]]
name = "wlx"
path = "src/bin/wlx.rs"
test = false

[[bin]]
name = "wlx2"
path = "src/bin/wlx2.rs"
test = false

[[bin]]
name = "wlxd"
path = "src/bin/wlxd.rs"
test = false

[[bin]]
name = "wlxe"
path = "src/bin/wlxe.rs"
test = false

[lints]
workspace = true
