[package]
name = "minix-libc"
version = "0.1.0"
description = "Minimal libc for FFI: C ABI wrappers over minix-std primitives"

[package.edition]
workspace = true

[package.license]
workspace = true

[dependencies]
minix-std = { path = "../minix-std" }
# rt off: syscall wrappers only (sbrk/brk for the C heap); no `_start`/
# panic handler/allocator — those belong to the standalone userland runtime.
minix-rt = { path = "../minix-rt", default-features = false }

[lints]
workspace = true

[features]
# Build the C library as `libc.so` (`cargo rustc --crate-type cdylib`). A
# shared object is a final artifact, so it has to supply the `panic` lang
# item itself; the rlib build leaves that to the program that links it.
so = []
