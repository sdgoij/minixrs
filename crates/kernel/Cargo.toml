[package]
name = "kernel"
version = "0.1.0"
description = "Core kernel: processes, scheduling, IPC, VM"

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.license]
workspace = true

[features]
default = []
embed_initramfs = []
embed_minixfs = []
qemu-tests = []
riscv64 = []
aarch64 = []
# Host-mode HAL: runs this kernel's arch-independent logic under cargo test
# instead of only in QEMU. Host-only; never enable it for a bare-metal target.
sim = ["dep:arch-sim"]

[dependencies]
arch-common = { path = "../arch-common" }
bitflags = { workspace = true }
arch-sim = { path = "../arch-sim", optional = true }

[build-dependencies]
boot-image = { path = "../boot-image" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
arch-x86_64 = { path = "../arch-x86_64" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
arch-wasm32 = { path = "../arch-wasm32" }

[target.'cfg(target_arch = "riscv64")'.dependencies]
arch-riscv64 = { path = "../arch-riscv64" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
arch-aarch64 = { path = "../arch-aarch64" }

[lints]
workspace = true
