[package]
name = "kernel-boot"
version = "0.1.0"
description = "Boot binary crate (breaks circular dep between kernel and arch-x86_64)"
autobins = false

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.license]
workspace = true

[features]
default = []
embed_initramfs = ["kernel/embed_initramfs"]
embed_minixfs = ["kernel/embed_minixfs"]
integration-tests = ["kernel/qemu-tests"]
boot-test = []
riscv64 = ["kernel/riscv64"]
aarch64 = ["kernel/aarch64"]

[lib]
name = "kernel_boot"
path = "src/lib.rs"

[[bin]]
name = "kernel-boot"
path = "src/main.rs"
required-features = []

[dependencies]
arch-common = { path = "../arch-common" }
kernel = { path = "../kernel" }
drivers = { path = "../drivers" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
arch-x86_64 = { path = "../arch-x86_64" }

[[bin]]
name = "kernel-boot-riscv64"
path = "src/riscv64_main.rs"
required-features = ["riscv64"]

[[bin]]
name = "kernel-boot-riscv64-boot"
path = "src/riscv64_boot.rs"
required-features = ["riscv64", "boot-test"]

[[bin]]
name = "kernel-boot-riscv64-test"
path = "src/riscv64_test.rs"
required-features = ["riscv64", "integration-tests"]

[target.'cfg(target_arch = "riscv64")'.dependencies]
arch-riscv64 = { path = "../arch-riscv64" }

[[bin]]
name = "kernel-boot-aarch64"
path = "src/aarch64_main.rs"
required-features = ["aarch64"]

[[bin]]
name = "kernel-boot-aarch64-boot"
path = "src/aarch64_boot.rs"
required-features = ["aarch64", "boot-test"]

[[bin]]
name = "kernel-boot-aarch64-test"
path = "src/aarch64_test.rs"
required-features = ["aarch64", "integration-tests"]

[target.'cfg(target_arch = "aarch64")'.dependencies]
arch-aarch64 = { path = "../arch-aarch64" }

[lints]
workspace = true
