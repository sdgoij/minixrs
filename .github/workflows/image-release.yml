# Builds each arch's images and publishes them as one release: a single-file ELF
# (downloading an ELF and pointing QEMU at it is the whole setup) and the split
# pair - a small boot ELF plus a system image attached as a virtio-blk disk. The
# system image is the form not capped by the 16 MiB embedded window, so it is where
# the full userland (coreutils and GNU bash) lives.
#
# The published images carry the bash that `ci.yml`'s `bash` job built for the same arch
# (its `bash-<arch>` artifact, injected here through `MINIXFS_EXTRA`), so the release ships
# a shell for scripts as well as the minix shell. That job is a `needs` of the `release` job
# that calls this file, so the artifacts exist before these jobs run - the wait is the same
# shape as the arch jobs' `needs: stage1`.
#
# These are ELFs because that is what `-kernel` loads - the format is the point,
# not an implementation detail. A raw disk image or an ISO is a different track
# (real hardware; `tools/mbr.S` + `stage2.S` + `mkimg.rs`, not wired up) rather
# than a rename of these, and naming one `.img` here would invite `dd` or
# `-drive file=`, which cannot boot it.
#
# Minutes rather than hours: the images are built against the stage1 published for
# the pinned `rust` commit (`just fetch-stage1`) instead of building LLVM and the
# compiler first. The one coupling is that a tag has to be pushed after the
# toolchain release for its `rust` pin exists, or the jobs stop at `fetch-stage1`
# (same as the arch jobs in `ci.yml`).
#
# Runs as part of the default workflow: `ci.yml` calls this as a job that `needs`
# the tests and the suites, so a green push to `main` - or a `v*` tag - publishes
# its own images with nobody pressing anything. Keeping the images and the release
# here rather than inline in `ci.yml` is what this file is for; the caller is one
# job that does nothing else.
#
# Deliberately *only* callable - no trigger of its own - so it cannot sit in the
# Actions sidebar as a workflow with a run history of its own. Its runs are the
# `release / ...` jobs inside the `minixrs` run, and a sidebar entry whose only run
# is an old failure is a dead end to click into. To retry a publish that failed,
# re-run the failed jobs of that `minixrs` run instead: the images are artifacts of
# the same run, so the publish job re-downloads them rather than rebuilding.
#
# The version depends on what triggered the caller, not on this file:
#   - a `v*` tag is the release and the version (`minix-x86-v0.1.0.elf`)
#   - a push to `main`, or a dispatch, is a per-commit build, versioned by the commit
#     (`minix-x86-<sha>.elf`) and released as `image-<sha>`, the convention
#     `stage1-<sha>` set. Those are published as prereleases, as is a semver
#     prerelease tag like `v0.2.0-rc.1`, so neither can take "latest" away from a
#     plain `v0.2.0` release.
# Either way the version is the same string in the release tag and the asset names.
#
# Each job *boots* what it built and drives it: `just image-<arch>` runs the self-contained
# artifact in QEMU, and `just test-system-image-<arch>` boots the split pair with its system
# image attached - each typing the userspace smoke scenario (`tools/smoke/scenario.tsv`) into
# its shell, and failing unless every step answers - so a release can only contain images whose
# shell execs a program from the image, writes a file and reads it back. That
# self-check's 15 s timeout is calibrated for a dev machine with KVM, so the job passes
# a larger `boot-timeout`: a runner emulates the guest.
#
# The emulator is not optional here either - the artifact boots userspace, so it is
# subject to the same floor as the suites (`qemu-min-version`), which
# `.github/actions/install-qemu` provides. Clang assembles the x86 trampoline, and
# the `rust` + `coreutils` submodules are needed by the workspace and the multicall
# (`build-x86` embeds it), all shallowly: none of that history is read.

name: boot images (called by minixrs)

on:
  workflow_call:
    inputs:
      host_tests:
        type: string
        required: true
      arch_tests:
        type: string
        required: true
      wasm_tests:
        type: string
        required: true
      wasm_wire_tests:
        type: string
        required: true
      bash:
        type: string
        required: true
      gltriangle:
        type: string
        required: true

concurrency:
  group: image-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The caller's gate results are checked here rather than by `needs` in `ci.yml`,
  # because `needs` *skips* this whole workflow when a gate is red, and a skipped job is
  # not revived by "re-run failed jobs": the retry goes green while `release` stays
  # skipped, so the run reports `success` and publishes nothing. Failing here instead
  # makes a red gate re-runnable.
  gate:
    name: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # `GATE_*`, not the bare names: `bash` exports a `BASH` variable, which would
      # override an injected `BASH:` and hide a red bash gate.
      GATE_HOST_TESTS: ${{ inputs.host_tests }}
      GATE_ARCH_TESTS: ${{ inputs.arch_tests }}
      GATE_WASM_TESTS: ${{ inputs.wasm_tests }}
      GATE_WASM_WIRE_TESTS: ${{ inputs.wasm_wire_tests }}
      GATE_BASH: ${{ inputs.bash }}
      GATE_GLTRIANGLE: ${{ inputs.gltriangle }}
    steps:
      - name: Every gate in the calling run passed
        run: |
          set -euo pipefail
          failed=0
          while IFS=: read -r name result; do
            if [ "$result" != success ]; then
              echo "!! the $name gate is '$result', not 'success' - not publishing" >&2
              failed=1
            fi
          done <<EOF
          host-tests:$GATE_HOST_TESTS
          arch-tests:$GATE_ARCH_TESTS
          wasm-tests:$GATE_WASM_TESTS
          wasm-wire-tests:$GATE_WASM_WIRE_TESTS
          bash:$GATE_BASH
          gltriangle:$GATE_GLTRIANGLE
          EOF
          [ "$failed" = 0 ] || exit 1
          echo "every gate passed"

  image:
    name: image (${{ matrix.arch }})
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, riscv64, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Check out the submodules
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 rust coreutils

      - uses: extractions/setup-just@v4

      - uses: ./.github/actions/install-clang

      - uses: ./.github/actions/install-qemu
        with:
          arch: ${{ matrix.arch }}

      # The recipes call `python` by that name.
      - name: Make python resolve
        run: sudo ln -sf /usr/bin/python3 /usr/local/bin/python

      - name: Install the prebuilt stage1
        run: just fetch-stage1 ${{ matrix.arch }}

      # The `bash` job in `ci.yml` built this arch's shell and published it as the
      # `bash-<arch>` artifact; the `release` job that calls this file `needs` that job,
      # so it exists by the time this one runs. Downloading it to the path the recipes
      # expect lets the build below inject `/bin/bash` into the published image.
      - uses: actions/download-artifact@v8
        with:
          name: bash-${{ matrix.arch }}
          path: target/bash/${{ matrix.arch }}

      # The `gltriangle` job in `ci.yml` built this arch's GL stack and published its seven
      # DSOs as `mesa-<arch>`; the `release` job that calls this file `needs` that job, so
      # they exist by the time this one runs. Injecting them into the system image is what
      # lets a released image run the C graphics stack.
      - uses: actions/download-artifact@v8
        with:
          name: mesa-${{ matrix.arch }}
          path: target/mesa/${{ matrix.arch }}/lib

      # 120 s against a dev machine's 15 s: it is the runner's emulation speed, not
      # a budget the image has to meet. A boot that is actually broken still fails
      # here, only later.
      - name: Build and boot the artifact
        env:
          # The same injection `just test-bash` uses, so the published image is the one
          # the `bash` job booted with `/bin/bash` in place. `scenario.tsv` still runs in
          # the minix shell - its `#` prompt is not replaced by an installed bash.
          MINIXFS_EXTRA: /bin/bash=target/bash/${{ matrix.arch }}/bash
        run: just image ${{ matrix.arch }} 120

      # The split form: a small boot image and a full system image (coreutils, GNU bash
      # because the `bash` artifact above is in place, and the seven Mesa DSOs because the
      # `mesa-<arch>` artifact is). The DSOs are ~36 MiB, so `MINIXFS_BLOCKS` is raised from
      # the recipe's 32 MiB default - the system image is the artifact the 16 MiB embedded
      # window cannot hold. `180` is the runner's emulation speed, not a budget. The recipe
      # boots what it builds and drives the smoke scenario, so the release cannot ship a
      # system image that was never booted.
      - name: Build and boot the boot image and system image
        run: |
          set -euo pipefail
          # Each DSO at the `/lib/<soname>` name its `DT_NEEDED` and `LIBGL_DRIVERS_PATH`
          # look it up by, so the loader finds it where it searches.
          extra=""
          for so in target/mesa/${{ matrix.arch }}/lib/*; do
            extra="${extra};/lib/$(basename "$so")=$so"
          done
          MINIXFS_EXTRA="${extra#;}" MINIXFS_BLOCKS=16384 \
            just test-system-image-${{ matrix.arch }} 180

      # Named without the version: the publish job is the only place that knows
      # whether this is a tag or a commit, so it renames on the way into the
      # release. `if-no-files-found: error` because the recipe's own check would
      # have passed on a file this glob then failed to match, e.g. after a rename.
      - uses: actions/upload-artifact@v7
        with:
          name: minix-${{ matrix.arch }}.elf
          path: target/images/*/minix-${{ matrix.arch }}.elf
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: minix-${{ matrix.arch }}-boot.elf
          path: target/images/*/minix-${{ matrix.arch }}-boot.elf
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: minix-${{ matrix.arch }}-system.img
          path: target/images/*/disk.img
          if-no-files-found: error

  # One job, not three: a release is created once, and a partial one is worse than
  # none - `needs` waits for every arch above, so a failure anywhere publishes
  # nothing.
  publish:
    name: release
    needs: image
    runs-on: ubuntu-24.04
    # Only this job writes, and only for its own release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Only the images: the `bash` job's `bash-<arch>` artifacts live in the same run,
          # and merging those into `images/` would leave shells beside the images. The
          # pattern is `minix-*`, so it takes the self-contained ELF, the boot image and
          # the system image for every arch.
          pattern: minix-*
          merge-multiple: true
          path: images

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$GITHUB_SHA"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version: ${version}"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd images
          # The arch jobs upload `target/images/<triple>/minix-<arch>.elf`, and an
          # artifact keeps whatever path sat below the upload glob's root, so the file
          # arrives nested (`images/x86_64-pc-minix/minix-x86.elf`) rather than flat.
          # Find it by name - `x86` is not the triple, and which directory a runner
          # used is not this job's business - and print the tree, so a change on
          # either side of this shows up as the layout rather than as "not found".
          find . -type f | sort
          for arch in x86 riscv64 aarch64; do
            # The self-contained ELF and the boot image keep the arch in their name, so
            # `find -name` locates them wherever the runner's upload placed them. The
            # system image is `disk.img`, with no arch in its name, so it is found
            # beside the boot image (the same `target/images/<triple>/` directory) rather
            # than by name - merging three arches would otherwise collide on `disk.img`.
            elf=$(find . -type f -name "minix-${arch}.elf" | head -1)
            boot=$(find . -type f -name "minix-${arch}-boot.elf" | head -1)
            [ -n "$elf" ] || { echo "!! no minix-${arch}.elf in the download"; exit 1; }
            [ -n "$boot" ] || { echo "!! no minix-${arch}-boot.elf in the download"; exit 1; }
            disk="$(dirname "$boot")/disk.img"
            [ -f "$disk" ] || { echo "!! no system image beside $boot"; exit 1; }
            mv "$elf" "minix-${arch}-${VERSION}.elf"
            mv "$boot" "minix-${arch}-${VERSION}-boot.elf"
            mv "$disk" "minix-${arch}-${VERSION}-system.img"
          done
          ls -lh
          sha256sum minix-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        env:
          # `github.token`, not `secrets.GITHUB_TOKEN`: a called workflow is always
          # handed the caller's token, while the secret of that name is not
          # something a call can rely on.
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # The tag *is* the release: the version, the release name and "latest".
            tag="$VERSION"
            subject="release ${VERSION} (commit ${GITHUB_SHA:0:12})"
          else
            # A per-commit build: named by the commit, and a prerelease so it cannot
            # become "latest" in place of a tagged one.
            tag="image-${GITHUB_SHA}"
            subject="commit ${GITHUB_SHA:0:12}"
          fi
          assets=(
            "images/minix-x86-${VERSION}.elf"
            "images/minix-x86-${VERSION}-boot.elf"
            "images/minix-x86-${VERSION}-system.img"
            "images/minix-riscv64-${VERSION}.elf"
            "images/minix-riscv64-${VERSION}-boot.elf"
            "images/minix-riscv64-${VERSION}-system.img"
            "images/minix-aarch64-${VERSION}.elf"
            "images/minix-aarch64-${VERSION}-boot.elf"
            "images/minix-aarch64-${VERSION}-system.img"
            images/SHA256SUMS
          )
          notes="$(printf '%s\n' \
            "MINIX/Rust boot images for ${subject}." \
            "" \
            "Per arch there are three artifacts:" \
            "" \
            "- \`minix-<arch>-<ver>.elf\` - one self-contained ELF: the initramfs and the" \
            "  MinixFS root image are embedded, so QEMU needs no disk attached." \
            "- \`minix-<arch>-<ver>-boot.elf\` and \`minix-<arch>-<ver>-system.img\` - the split" \
            "  form: \`-kernel\` the boot image and attach the system image with the" \
            "  \`-drive\`/\`-device virtio-blk\` pair below. The system image is the full" \
            "  userland (coreutils and GNU bash included); it is the artifact not capped by" \
            "  the 16 MiB embedded window, so it is where large additions belong." \
            "" \
            "Each was booted by the run that built it - the split pair with the system image" \
            "attached - and each needs QEMU 11 or newer, the floor the test suites enforce" \
            "as well." \
            "" \
            "Check the download with \`sha256sum -c SHA256SUMS\`, then boot it with the" \
            "command line below. The shell is on stdio; \`-nographic\` is what makes it" \
            "usable from a terminal, and the display and input devices are the ones the" \
            "build verified (without virtio-gpu the framebuffer does not come up on" \
            "riscv64/aarch64)." \
            "" \
            "x86_64 (self-contained):" \
            "" \
            "    qemu-system-x86_64 -nographic -m 256M -no-reboot -vga none -device bochs-display,id=fb0 -kernel minix-x86-${VERSION}.elf -netdev user,id=net0 -device virtio-net-pci,disable-legacy=on,netdev=net0 -device virtio-tablet-pci,display=fb0" \
            "" \
            "x86_64 (split):" \
            "" \
            "    qemu-system-x86_64 -nographic -m 256M -no-reboot -vga none -device bochs-display,id=fb0 -kernel minix-x86-${VERSION}-boot.elf -drive if=none,id=disk0,file=minix-x86-${VERSION}-system.img,format=raw,cache=writethrough -device virtio-blk-pci,disable-legacy=on,drive=disk0 -netdev user,id=net0 -device virtio-net-pci,disable-legacy=on,netdev=net0 -device virtio-tablet-pci,display=fb0" \
            "" \
            "RISC-V64 (self-contained):" \
            "" \
            "    qemu-system-riscv64 -machine virt -m 256M -nographic -global virtio-mmio.force-legacy=off -netdev user,id=net0 -device virtio-net-device,netdev=net0 -device virtio-gpu-device -device virtio-keyboard-device -kernel minix-riscv64-${VERSION}.elf" \
            "" \
            "RISC-V64 (split):" \
            "" \
            "    qemu-system-riscv64 -machine virt -m 256M -nographic -global virtio-mmio.force-legacy=off -drive if=none,id=disk0,file=minix-riscv64-${VERSION}-system.img,format=raw,cache=writethrough -device virtio-blk-device,drive=disk0 -netdev user,id=net0 -device virtio-net-device,netdev=net0 -device virtio-gpu-device -device virtio-keyboard-device -kernel minix-riscv64-${VERSION}-boot.elf" \
            "" \
            "AArch64 (self-contained):" \
            "" \
            "    qemu-system-aarch64 -machine virt -cpu cortex-a57 -m 256M -nographic -no-reboot -global virtio-mmio.force-legacy=off -netdev user,id=net0 -device virtio-net-device,netdev=net0 -device virtio-gpu-device -device virtio-keyboard-device -kernel minix-aarch64-${VERSION}.elf" \
            "" \
            "AArch64 (split):" \
            "" \
            "    qemu-system-aarch64 -machine virt -cpu cortex-a57 -m 256M -nographic -no-reboot -global virtio-mmio.force-legacy=off -drive if=none,id=disk0,file=minix-aarch64-${VERSION}-system.img,format=raw,cache=writethrough -device virtio-blk-device,drive=disk0 -netdev user,id=net0 -device virtio-net-device,netdev=net0 -device virtio-gpu-device -device virtio-keyboard-device -kernel minix-aarch64-${VERSION}-boot.elf")"
          # Re-running a tag or a commit replaces the assets rather than failing: the
          # release name is derived, so a second run is a rebuild, not a new release.
          if gh release view "${tag}" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "${tag}" -R "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            gh release edit "${tag}" -R "$GITHUB_REPOSITORY" --notes "${notes}"
          else
            # Prerelease unless this is a plain `v0.2.0`: a semver prerelease tag
            # (`v0.2.0-rc.1`) is not a release yet, and neither is a per-commit build,
            # so "latest" is the newest milestone rather than the newest build. The
            # hyphen test is on the *tag*: on a dispatch `GITHUB_REF_NAME` is the
            # branch, and a branch called `feature/qemu-fix` must not decide this.
            prerelease=(--prerelease)
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              case "$GITHUB_REF_NAME" in
                *-*) ;;
                *) prerelease=() ;;
              esac
            fi
            gh release create "${tag}" -R "$GITHUB_REPOSITORY" \
              "${prerelease[@]}" \
              --title "boot images ${VERSION}" \
              --notes "${notes}" \
              "${assets[@]}"
          fi
          echo "published ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"
