# CI: host tests on Windows and Linux, the per-arch boot and QEMU suites on Linux,
# and - for the commits that pass - the boot images, published as a release.
#
# macOS is deliberately not in the host matrix: the host tests surface
# macOS-specific issues that are out of scope for now. Re-adding it means one
# more entry in the `host-tests` matrix below (and a 10x runner-minute rate).
#
# The jobs are one chain: `host-tests` and `arch-tests` are the gate, and then
# `release` calls `.github/workflows/image-release.yml`, which builds and boots one
# artifact per arch and publishes them. The images live in their own file because
# that is where the release logic belongs; they run here because `needs` is what
# makes the release downstream of the tests rather than a separate thing that might
# publish a commit whose suites failed. Pull requests skip it, so a green push to
# `main` publishes its images, and a `v*` tag does too.
#
# The arch suites consume the stage1 that `toolchain-release.yml` publishes for
# the commit the `rust` submodule pins: `just fetch-stage1` downloads it, which is
# what makes these jobs affordable - a from-source LLVM build per job is not.
#
# The `rust-pin` job below closes that loop, so bumping the pin is a one-commit
# change again: it reads the gitlink out of the push and asks whether
# `stage1-<pin>` exists, and when the pin moved or no release is there, the
# `stage1` job builds and publishes it *before* the suites run. A missing release
# therefore can no longer strand an otherwise green run (it used to need a manual
# `toolchain release` run that was easy to forget). A pull request cannot publish
# a release, so a PR that bumps the pin fails its suites until the merge builds
# the toolchain - a fork PR could not write one at all.
#
# The image jobs depend on the suites for the same reason. Both suites also run
# locally (`just test-boot-<arch>`, `just test-qemu-<arch>`, on Windows too); they
# gate on the guest's serial log via `just _assert-qemu-log`.
#
# The two wasm jobs close the last hole, and they are separate jobs on purpose. The
# port's wasm front ends are its strongest surface - `run.js` types at a shell,
# execs off the image, forks, and re-reads a disk - and nothing ran them: they were
# manual because `build.sh` needs a nightly and Binaryen, which is a runner setup
# rather than a code problem (`TEST_GATES.md` cause (i), `ARCH_WASM32.md` §13). What
# they caught on the way to being wired in is the argument for wiring them: an
# arena overlapping the kernel's own statics (finding 61) and a yield that could not
# switch processes (finding 62), the second of which reached a reader as `stopped:
# the syscall budget ran out` while dragging the mouse over the desktop.
#
# `wasm-wire-tests` needs none of that toolchain: the network link is plain
# JavaScript and its tests exercise the *link* rather than the guest, so they need
# no artifacts. Splitting it out means a toolchain problem cannot hide the cheap
# half, and a failure names which half of the wasm surface broke.
#
# Learned the hard way, for whoever edits this next: a fresh checkout pulls ~4.5
# GiB of submodule history the build never reads (`rust` ~1.0 GiB,
# `src/llvm-project` ~3.4 GiB), so clone the submodules with `--depth 1`; the
# published toolchain is built on ubuntu-24.04, so a runner older than that
# cannot run it (newer is fine); the emulator version matters as much as the
# compiler's - every image's QEMU is below the suite floor (8.2 on ubuntu-24.04,
# 10.2 on 26.04), so `.github/actions/install-qemu` builds the pinned one for each
# job instead of the jobs pinning an image for it; and clang stays at least as
# new as the dev machines' (`.github/actions/install-clang`), because syntax a
# newer clang accepts silently is a hard error on the older one.

name: minixrs

on:
  # Pushes to main plus every PR; widen to all branches if runner minutes
  # are not a constraint. Tags publish too: see the `release` job.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancelling is for pull requests, where only the newest attempt matters. A run on
  # `main` or a tag is not cancelled: it may be in the middle of publishing a
  # release, and a half-uploaded one is worse than a queued run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# Windows runners default to PowerShell; the submodule setup below is POSIX shell.
defaults:
  run:
    shell: bash

jobs:
  host-tests:
    name: host tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      # crates/{minix-rt,minix-std,net} declare path dependencies into
      # rust/library/... — optional and gated behind `rustc-dep-of-std`, but
      # cargo has to load those manifests to resolve the workspace, so without
      # `rust` present every cargo command fails with "unable to update
      # .../rust/library/compiler-builtins/compiler-builtins".
      #
      # Only that submodule: coreutils has no path dependencies, and
      # library/compiler-builtins/compiler-builtins is a plain directory inside
      # the rust repo, not a nested submodule, so nothing deeper is needed. If
      # a shallow fetch of the pinned commit ever fails, drop `--depth 1`.
      - name: Check out the rust submodule
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 rust

      - uses: extractions/setup-just@v4

      - name: Show toolchain
        run: |
          just --version
          rustc -vV

      # Host-only build. crates/kernel/build.rs assembles the per-arch boot
      # binaries only when TARGET is a minix triple, and every kernel-boot bin
      # is behind required-features, so no fork toolchain, clang or QEMU is
      # involved (kernel-boot/build.rs skips the trampoline when it finds no
      # clang or lld).
      - name: Run host tests
        run: cargo test --workspace

      # The pinned channel's clippy component is not guaranteed to be in the
      # runner image, so add it explicitly - the `test-linux` recipe does the
      # same in the container.
      - name: Run clippy
        if: runner.os == 'Linux'
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings

  # The network link's own tests (M6): the gateway's replies, and the WebSocket relay over a real
  # socket. Neither needs a toolchain, an artifact or a submodule - `net.js` and `relay.js` are
  # plain JavaScript - which is why this job can be the cheap half of the wasm surface rather than
  # waiting on the one below.
  wasm-wire-tests:
    name: wasm wire tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      # Not for the tests' sake but for the transport's: `relay.test.js` drives the relay with the
      # WebSocket *client* Node ships, which is a global only from 22.4 on. The runner's default
      # Node is whatever the image carries, and a wire test whose client is missing would fail for a
      # reason that has nothing to do with the wire.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: The link's own frames, checked the way a receiver checks them
        run: node tools/wasm-browser/net.test.js

      - name: The relay, over a real socket
        run: node tools/wasm-net/relay.test.js

  # The wasm system itself: the kernel instance, the servers and the program module built for
  # `wasm32-minix`, then the three harnesses over them. `boot.cjs` runs at quiescence and checks the
  # boot chain and every device; `run.js` runs at a live prompt and checks the same artifacts with a
  # shell that is actually working; `page.test.js` checks the page's own code under a stub DOM.
  wasm-tests:
    name: wasm system
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The same reason `host-tests` fetches it: `crates/{minix-rt,minix-std,net}` declare path
      # dependencies into `rust/library/...`, optional and gated behind `rustc-dep-of-std`, but
      # cargo has to load those manifests to resolve, so without `rust` present every cargo command
      # fails before it compiles anything. The wasm crates are built from the same workspace, so it
      # is needed here too — and only this one: `coreutils` is an x86 image's multicall, not a wasm
      # module's.
      - name: Check out the rust submodule
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 rust

      # `-Z build-std` compiles `core` and `alloc` from source, which is a component rather than
      # part of the toolchain's default profile.
      - name: Install a nightly, with the sources build-std compiles
        run: rustup toolchain install nightly --profile minimal --component rust-src

      # Binaryen is not in the repository (`tools/fork-spike/.gitignore` keeps `.tools/` out), so
      # the path `build.sh` looks for it at is where this has to put it. The npm package carries the
      # binaries.
      - name: Install Binaryen where build.sh looks for it
        run: npm install binaryen --prefix tools/fork-spike/.tools --no-save

      # `tools/wasm-browser/build.sh` rather than `tools/wasm-servers/build.sh`, though the latter is
      # the whole build: this one also *stages* what the page fetches into
      # `tools/wasm-browser/build/`, and `page.test.js` boots the page against that directory. It is
      # the difference between the harnesses that read `tools/wasm-servers/build` (`boot.cjs`,
      # `run.js`, which take their image from `target/images/`) and the one that reads the page's own
      # copy: locally that directory survives between runs and hides it, a fresh checkout has no
      # `build/` at all, and the job failed exactly there.
      - name: Build and stage the kernel, the servers and the program module
        run: sh tools/wasm-browser/build.sh

      - name: Check harness, at quiescence
        run: node tools/wasm-servers/boot.cjs

      - name: Engine, at a live prompt
        run: node tools/wasm-browser/run.js

      - name: The page's own code, under a stub DOM
        run: node tools/wasm-browser/page.test.js

  # Decides whether the pinned rust commit needs a toolchain before anything
  # consumes one. Read-only, so it needs no write permission; `stage1` below does
  # the publishing. The parent repository is small (its submodules are not fetched
  # here), so the full history this diffs the push range against is cheap.
  rust-pin:
    name: rust pin / stage1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      pin: ${{ steps.check.outputs.pin }}
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # No submodules and no depth limit: the gitlink is read out of the tree
          # and the push range is diffed, both of which need the history but
          # neither of which needs the ~4.5 GiB of submodule history the builds
          # elsewhere in this file fetch.
          submodules: false
          fetch-depth: 0

      - name: Decide whether a stage1 has to be built
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The pinned commit, out of the tree rather than out of a clone: the
          # submodule is not fetched here.
          pin="$(git rev-parse HEAD:rust)"
          echo "pin=${pin}" >> "$GITHUB_OUTPUT"

          # What to diff for "did this push move the pin". A push has the previous
          # tip; a PR is compared against its base; anything else (a manual run, a
          # first push, a forced one) falls back to the tip's own change.
          case "${{ github.event_name }}" in
            push)
              before='${{ github.event.before }}'
              if [ -n "$before" ] && [[ ! "$before" =~ ^0+$ ]] \
                 && git cat-file -e "${before}^{commit}" 2>/dev/null; then
                range="${before}..${{ github.sha }}"
              else
                range="HEAD^..HEAD"
              fi
              ;;
            pull_request)
              range="origin/${{ github.base_ref }}...HEAD"
              ;;
            *)
              range="HEAD^..HEAD"
              ;;
          esac

          # A range that cannot be resolved counts as "changed": building a
          # toolchain that already exists only costs runner minutes, while the
          # opposite mistake fails every arch job.
          if ! git diff --quiet "$range" -- rust 2>/dev/null; then
            changed=true
          else
            changed=false
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

          # `gh release view` exits 1 for "no such release" and something else for
          # a real failure (no `gh`, no token, the API down). Both mean the suites
          # have nothing to fetch, so both build - the difference is only in what
          # the log says, so treat an unexpected exit code as "not published" and
          # let the step summary show it.
          if gh release view "stage1-${pin}" > /dev/null 2>&1; then
            published=true
          else
            published=false
          fi
          echo "published=${published}" >> "$GITHUB_OUTPUT"

          # The trigger is the missing release, not the moved pin: the pin can
          # legitimately point at a commit whose toolchain was published earlier
          # (publish first, then bump), and rebuilding that is a full LLVM build
          # for nothing. A moved pin is what usually explains a missing release,
          # which is why the range above is reported next to the decision.
          if [ "$published" = true ]; then
            needed=false
          else
            needed=true
          fi
          echo "needed=${needed}" >> "$GITHUB_OUTPUT"

          {
            echo "### stage1 for \`${pin:0:12}\`"
            echo
            echo "- \`rust\` changed in \`${range}\`: **${changed}**"
            echo "- \`stage1-${pin}\` published: **${published}**"
            echo "- build needed: **${needed}**"
          } >> "$GITHUB_STEP_SUMMARY"

  # One LLVM build, and only when the pin has no toolchain yet - it runs before
  # anything that would consume one. This calls the workflow the operator can also
  # run by hand, so the build and its publishing rules keep one home.
  stage1:
    name: stage1
    needs: rust-pin
    if: >-
      needs.rust-pin.outputs.needed == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    # The called workflow writes a release, so the caller has to allow that much.
    permissions:
      contents: write
    uses: ./.github/workflows/toolchain-release.yml
    secrets: inherit

  # The per-arch boot and kernel suites, on the stage1 published for the pinned
  # `rust` commit (see the header). One job per arch so a failure names its arch
  # and the three run in parallel; each pays its own 230 MB download, which is
  # cheap next to the LLVM build this replaced.
  #
  # The image only has to be new enough for the stage1 (ubuntu-24.04, what it was
  # built on); the emulator comes from `install-qemu`, which builds the version
  # the suites require and caches it. No image pin is load-bearing here.
  #
  # `just image-<arch>` runs in this job as its last step, because it is the one check on
  # the artifact a user gets rather than on a kernel built for a suite: it boots the
  # shipped image and types the userspace smoke scenario into the shell. The release job
  # below re-runs the same recipes with a larger `boot-timeout` - a runner emulates the
  # guest, and the recipe's 15 s is calibrated for a dev machine with KVM.
  #
  # The `if` is spelled out because `stage1` is *skipped* whenever there is nothing
  # to build, and a skipped dependency propagates like a failed one - the suites
  # would disappear from exactly the runs that are fine.
  arch-tests:
    name: boot + qemu (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [rust-pin, stage1]
    if: >-
      !cancelled() &&
      needs.rust-pin.result == 'success' &&
      (needs.stage1.result == 'success' || needs.stage1.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, riscv64, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      # `rust` is the pin `just fetch-stage1` resolves the release from (and
      # supplies the workspace's path dependencies); `coreutils` is the multicall
      # the kernel embeds - on x86_64 only so far, every arch eventually, so it is
      # cloned for all of them. Both shallow: the build reads none of the history.
      - name: Check out the submodules
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 rust coreutils

      - uses: extractions/setup-just@v4

      - uses: ./.github/actions/install-clang

      # The suites refuse an emulator below `qemu-min-version`, an image has none
      # that new, and no distribution packages one yet - so build it. Cached, so
      # this is a restore on every run after the first.
      - uses: ./.github/actions/install-qemu
        with:
          arch: ${{ matrix.arch }}

      # The recipes call `python` by that name.
      - name: Make python resolve
        run: sudo ln -sf /usr/bin/python3 /usr/local/bin/python

      - name: Install the prebuilt stage1
        run: just fetch-stage1 ${{ matrix.arch }}

      - name: Kernel integration suite
        run: just test-qemu ${{ matrix.arch }}

      - name: Boot suite
        run: just test-boot ${{ matrix.arch }}

      # The shipped artifact, which is not what the suites above run: they use a kernel
      # built with the test features, and this is the image a release publishes - without
      # the optional `/bin/bash` the release workflow injects, which the `bash` job boots
      # separately. The recipe boots it and drives `tools/smoke/scenario.tsv` into its
      # shell - a program exec'd from the image, a file written, that file read back. 120 s
      # against a dev machine's 15: a runner emulates the guest, and a boot that is
      # actually broken still fails here, only later.
      - name: The shipped image, driven through the smoke scenario
        run: just image ${{ matrix.arch }} 120

  # The port's largest C consumer, built for every arch and booted. bash is fetched at
  # the pinned upstream commit, configured against `tools/c-include`, linked against
  # minix-libc (`tools/build-bash.py`), and then driven through `tools/smoke/bash.tsv` in
  # the guest. This is the only job that builds a third-party C project, so it is where a
  # missing header, a missing libc export or a link flag that stopped being forwarded shows
  # up: the C smoke binaries (/bin/helloc, /bin/ctest) exercise the same surface, but
  # nowhere near this much of it.
  #
  # Each arch's shell is published as the `bash-<arch>` artifact, and the release workflow
  # downloads it and injects it into the image it publishes, so a released image carries
  # `/bin/bash`. bash is deliberately *not* a `BOOT_BINS` entry: a plain image build must
  # not depend on bash having been built, so a local `just image` stays bash-free and the
  # coupling lives here, in the release path.
  bash:
    name: bash (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The same wait the arch jobs take: when the pin has changed, `stage1` builds and
    # publishes the toolchain release that `fetch-stage1` consumes, and a *skipped*
    # `stage1` (nothing to build) must not read as a failure.
    needs: [rust-pin, stage1]
    if: >-
      !cancelled() &&
      needs.rust-pin.result == 'success' &&
      (needs.stage1.result == 'success' || needs.stage1.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, riscv64, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Check out the submodules
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 rust coreutils

      - uses: extractions/setup-just@v4

      - uses: ./.github/actions/install-clang

      - uses: ./.github/actions/install-qemu
        with:
          arch: ${{ matrix.arch }}

      # The recipes call `python` by that name.
      - name: Make python resolve
        run: sudo ln -sf /usr/bin/python3 /usr/local/bin/python

      - name: Install the prebuilt stage1
        run: just fetch-stage1 ${{ matrix.arch }}

      # Fetches bash (a full clone the first time — the pin is a commit, so a
      # shallow one is not enough), rebuilds minix-libc with this host's stage1,
      # configures, links, and boots the result through the bash scenario. 120 s of
      # boot budget, as `image` above: a runner emulates the guest.
      - name: Build bash and boot it
        run: just test-bash ${{ matrix.arch }} 120

      # `just test-bash` just wrote target/bash/<arch>/bash; hand it to the release
      # workflow. `if-no-files-found: error` because a rename on either side should fail
      # loudly rather than let a release image ship without the shell it was promised.
      - uses: actions/upload-artifact@v7
        with:
          name: bash-${{ matrix.arch }}
          path: target/bash/${{ matrix.arch }}/bash
          if-no-files-found: error

  # The images and the release live in `.github/workflows/image-release.yml`, which
  # this calls: the release logic keeps one home, and `needs` is what makes the
  # release downstream of the tests and the suites rather than something that could
  # publish a commit whose suites failed. Pull requests are excluded by the `if`, so
  # a green push to `main` - and a `v*` tag - publishes its own images with nobody
  # pressing anything. This job does nothing else; the work is in that file.
  release:
    name: release
    needs: [host-tests, arch-tests, wasm-tests, wasm-wire-tests, bash]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    # The called workflow writes a release, so the caller has to allow that much.
    permissions:
      contents: write
    uses: ./.github/workflows/image-release.yml
    secrets: inherit
